/* =====================================================
   BLOK ANAHTARI
===================================================== */

function blockKey(
  x,
  y,
  z
){

  return (
    x+
    ","+
    y+
    ","+
    z
  );

}


/* =====================================================
   BLOK GETİR
===================================================== */

function getBlock(
  x,
  y,
  z
){

  return world.get(
    blockKey(x,y,z)
  ) || "air";

}


/* =====================================================
   BLOK AYARLA
===================================================== */

function setBlock(
  x,
  y,
  z,
  type
){

  if(
    x<0||
    z<0||
    y<0||
    x>=WORLD_SIZE||
    z>=WORLD_SIZE||
    y>=WORLD_HEIGHT
  ){

    return;

  }

  const key=
    blockKey(x,y,z);

  world.set(
    key,
    type
  );

}


/* =====================================================
   MATERYAL
===================================================== */

function makeMaterial(
  color,
  transparent
){

  return new THREE.MeshLambertMaterial({

    color:color,

    transparent:!!transparent,

    opacity:
      transparent
      ? .55
      : 1

  });

}


/* =====================================================
   BLOK MESH
===================================================== */

function createBlockMesh(
  x,
  y,
  z,
  type
){

  const data=
    BLOCKS[type];

  if(!data){

    return null;

  }


  const c=
    data.colors;


  const materials=[

    makeMaterial(
      c.right,
      data.transparent
    ),

    makeMaterial(
      c.left,
      data.transparent
    ),

    makeMaterial(
      c.top,
      data.transparent
    ),

    makeMaterial(
      c.bottom,
      data.transparent
    ),

    makeMaterial(
      c.front,
      data.transparent
    ),

    makeMaterial(
      c.back,
      data.transparent
    )

  ];


  const mesh=
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1,
        1,
        1
      ),

      materials

    );


  mesh.position.set(
    x,
    y,
    z
  );


  mesh.userData={
    x:x,
    y:y,
    z:z,
    type:type
  };


  scene.add(mesh);


  blockMeshes.push(mesh);


  blockMap.set(
    blockKey(x,y,z),
    mesh
  );


  return mesh;

}


/* =====================================================
   BLOK MESH SİL
===================================================== */

function removeBlockMesh(
  x,
  y,
  z
){

  const key=
    blockKey(x,y,z);

  const mesh=
    blockMap.get(key);

  if(!mesh){

    return;

  }


  scene.remove(mesh);


  const index=
    blockMeshes.indexOf(mesh);


  if(index!==-1){

    blockMeshes.splice(
      index,
      1
    );

  }


  if(
    Array.isArray(
      mesh.material
    )
  ){

    mesh.material.forEach(
      material=>{
        material.dispose();
      }
    );

  }


  mesh.geometry.dispose();


  blockMap.delete(key);

}


/* =====================================================
   DÜNYAYA BLOK KOY
===================================================== */

function buildBlock(
  x,
  y,
  z,
  type
){

  setBlock(
    x,
    y,
    z,
    type
  );

  createBlockMesh(
    x,
    y,
    z,
    type
  );

}


/* =====================================================
   ARAZİ YÜKSEKLİĞİ
===================================================== */

function terrainHeight(
  x,
  z
){

  const a=
    Math.sin(x*.18)*2;

  const b=
    Math.cos(z*.21)*2;

  const c=
    Math.sin(
      (x+z)*.08
    )*2;

  return Math.max(
    2,
    Math.floor(
      6+a+b+c
    )
  );

}


/* =====================================================
   DÜNYA OLUŞTUR
===================================================== */

function generateWorld(){

  for(
    let x=0;
    x<WORLD_SIZE;
    x++
  ){

    for(
      let z=0;
      z<WORLD_SIZE;
      z++
    ){

      const height=
        terrainHeight(
          x,
          z
        );


      for(
        let y=0;
        y<=height;
        y++
      ){

        let type;


        if(y===0){

          type="stone";

        }

        else if(
          y<height-3
        ){

          type="stone";

        }

        else if(
          y<height
        ){

          type="dirt";

        }

        else{

          type="grass";

        }


        buildBlock(
          x,
          y,
          z,
          type
        );

      }

    }

  }

}


/* =====================================================
   OYUNCU POZİSYONU
===================================================== */

function updateCamera(){

  camera.position.set(

    player.x,

    player.y+
      (
        player.crouching
        ? .65
        : 1
      ),

    player.z

  );


  camera.rotation.order=
    "YXZ";


  camera.rotation.y=
    yaw;


  camera.rotation.x=
    pitch;

}


/* =====================================================
   HAREKET
===================================================== */

function updatePlayer(
  delta
){

  let speed=
    player.running
    ? player.runSpeed
    : player.speed;


  if(
    player.crouching
  ){

    speed*=.5;

  }


  if(
    player.swimming
  ){

    speed*=.65;

  }


  let forward=0;

  let strafe=0;


  if(keys.KeyW){

    forward+=1;

  }


  if(keys.KeyS){

    forward-=1;

  }


  if(keys.KeyA){

    strafe-=1;

  }


  if(keys.KeyD){

    strafe+=1;

  }


  const length=
    Math.hypot(
      forward,
      strafe
    );


  if(length>0){

    forward/=length;

    strafe/=length;

  }


  const sin=
    Math.sin(yaw);

  const cos=
    Math.cos(yaw);


  player.vx=
    (
      strafe*cos+
      forward*sin
    )*
    speed;


  player.vz=
    (
      strafe*-sin+
      forward*cos
    )*
    speed;


  player.vy-=
    20*delta;


  if(
    keys.Space &&
    player.grounded
  ){

    player.vy=
      player.jump;

    player.grounded=
      false;

  }


  player.x+=
    player.vx*
    delta;


  player.z+=
    player.vz*
    delta;


  player.y+=
    player.vy*
    delta;


  if(
    player.y<7
  ){

    player.y=7;

    player.vy=0;

    player.grounded=
      true;

  }


  player.x=
    Math.max(
      1,
      Math.min(
        WORLD_SIZE-2,
        player.x
      )
    );


  player.z=
    Math.max(
      1,
      Math.min(
        WORLD_SIZE-2,
        player.z
      )
    );

}


/* =====================================================

window.addEventListener(

  event=>{

    keys[event.code]=true;


    if(

    if(

      event.code==="ShiftRight"
    ){

      player.running=
        true;

    }


    if(
      event.code==="KeyX" &&
      !event.repeat
    ){

      toggleInventory();

    }


    if(
      event.code==="KeyQ" &&
      !event.repeat
    ){

      showMessage(
        "👏 Emote!"
      );

    }


    if(
      event.code==="KeyT" &&
      !event.repeat
    ){

      dropSelectedItem();

    }

  }
);


window.addEventListener(
  "keyup",
  event=>{

    keys[event.code]=
      false;


    if(
      event.code==="KeyC"
    ){

      player.crouching=
        false;

    }


    if(
      event.code==="ShiftLeft"||
      event.code==="ShiftRight"
    ){

      player.running=
        false;

    }

  }
);


/* =====================================================
   ENVANTERİ GÖSTER
===================================================== */

function renderInventory(){

  const grid=
    $("inventoryGrid");


  grid.innerHTML="";


  Object.keys(
    inventory.items
  ).forEach(
    type=>{

      const slot=
        document.createElement(
          "div"
        );


      slot.className=
        "slot";


      if(
        type===
        inventory.selected
      ){

        slot.classList.add(
          "selected"
        );

      }


      slot.textContent=
        (
          BLOCKS[type]
          ?.name ||
          type
        )+
        "\n×"+
        inventory.items[type];


      slot.addEventListener(
        "click",
        ()=>{

          inventory.selected=
            type;

          renderInventory();

        }
      );


      grid.appendChild(
        slot
      );

    }
  );

}


/* =====================================================
   ENVANTER AÇ/KAPAT
===================================================== */

function toggleInventory(){

  inventory.open=
    !inventory.open;


  $("inventory")
    .classList.toggle(
      "open",
      inventory.open
    );


  renderInventory();


  if(
    inventory.open &&
    document.pointerLockElement
  ){

    document.exitPointerLock();

  }

}


/* =====================================================
   EŞYA AT
===================================================== */

function dropSelectedItem(){

  const type=
    inventory.selected;


  if(
    !inventory.items[type]||
    inventory.items[type]<=0
  ){

    showMessage(
      "Eşya yok!"
    );

    return;

  }


  inventory.items[type]--;

  renderInventory();


  showMessage(
    BLOCKS[type].name+
    " atıldı!"
  );

}


/* =====================================================
   MESAJ
===================================================== */

let messageTimer=null;


function showMessage(
  text
){

  const box=
    $("message");


  box.textContent=
    text;


  box.classList.add(
    "show"
  );


  clearTimeout(
    messageTimer
  );


  messageTimer=
    setTimeout(
      ()=>{

        box.classList.remove(
          "show"
        );

      },
      1300
    );

}


/* =====================================================
   MOUSE
===================================================== */

document.addEventListener(
  "mousemove",
  event=>{

    if(!pointerLocked){

      return;

    }


    yaw-=
      event.movementX*
      .0025;


    pitch-=
      event.movementY*
      .0025;


    pitch=
      Math.max(
        -1.4,
        Math.min(
          1.4,
          pitch
        )
      );

  }
);


document.addEventListener(
  "pointerlockchange",
  ()=>{

    pointerLocked=
      document.pointerLockElement===
      renderer.domElement;

  }
);


rendererClick();


function rendererClick(){

  document.addEventListener(
    "click",
    ()=>{

      if(
        !inventory.open
      ){

        renderer.domElement
          .requestPointerLock();

      }

    }
  );

}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster=
  new THREE.Raycaster();


const center=
  new THREE.Vector2(
    0,
    0
  );


function getTarget(){

  raycaster.setFromCamera(
    center,
    camera
  );


  const hits=
    raycaster.intersectObjects(
      blockMeshes,
      false
    );


  if(!hits.length){

    return null;

  }


  return hits[0];

}


/* =====================================================
   BLOK KIR
===================================================== */

function breakTarget(){

  const hit=
    getTarget();


  if(!hit){

    return;

  }


  const mesh=
    hit.object;


  const data=
    mesh.userData;


  const type=
    getBlock(
      data.x,
      data.y,
      data.z
    );


  if(
    type==="stone" &&
    data.y===0
  ){

    return;

  }


  removeBlockMesh(
    data.x,
    data.y,
    data.z
  );


  setBlock(
    data.x,
    data.y,
    data.z,
    "air"
  );


  if(
    BLOCKS[type]
  ){

    if(
      inventory.items[type]===
      undefined
    ){

      inventory.items[type]=0;

    }


    inventory.items[type]++;

    renderInventory();

  }


  showMessage(
    BLOCKS[type]?.name+
    " kırıldı"
  );

}


/* =====================================================
   BLOK KOY
===================================================== */

function placeSelected(){

  const hit=
    getTarget();


  if(!hit){

    return;

  }


  const type=
    inventory.selected;


  if(
    !BLOCKS[type]||
    inventory.items[type]<=0
  ){

    return;

  }


  const normal=
    hit.face.normal.clone();


  const position=
    hit.object.position.clone();


  position.add(
    normal
  );


  const x=
    Math.round(
      position.x
    );


  const y=
    Math.round(
      position.y
    );


  const z=
    Math.round(
      position.z
    );


  if(
    getBlock(x,y,z)!==
    "air"
  ){

    return;

  }


  if(
    y<1||
    y>=WORLD_HEIGHT
  ){

    return;

  }


  buildBlock(
    x,
    y,
    z,
    type
  );


  inventory.items[type]--;

  renderInventory();

}


/* =====================================================
   MOUSE TIKLARI
===================================================== */

rendererMouse();


function rendererMouse(){

  document.addEventListener(
    "mousedown",
    event=>{

      if(
        !pointerLocked
      ){

        return;

      }


      if(
        event.button===0
      ){

        breakTarget();

      }


      if(
        event.button===2
      ){

        placeSelected();

      }

    }
  );


  document.addEventListener(
    "contextmenu",
    event=>{
      event.preventDefault();
    }
  );

}

function init(){

  scene=
    new THREE.Scene();


  scene.background=
    new THREE.Color(
      0x87ceeb
    );


  camera=
    new THREE.PerspectiveCamera(
      75,
      innerWidth/
      innerHeight,

      500
    );


  renderer=
    new THREE.WebGLRenderer({

      antialias:true,

      powerPreference:

    });


  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio||1,
      2
    )
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.outputColorSpace=
    THREE.SRGBColorSpace;


  $("game")
    .appendChild(
      renderer.domElement
    );


  clock=

  const ambient=
    new THREE.HemisphereLight(
      0xffffff,
      0x555555,
      1.8
    );


  scene.add(

  );


  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      2
    );


  sun.position.set(

    60,
    30
  );


  scene.add(

  );


  generateWorld();

===================================================== */

let lastTime=
  performance.now();


function animate(){

  requestAnimationFrame(
    animate
  );


  const now=
    performance.now();


  const delta=
    Math.min(
      (now-lastTime)/1000,
      .05
    );


  lastTime=
    now;


  if(worldReady){

    updatePlayer(
      delta
    );


    updateCamera();

  }


  renderer.render(
    scene,
    camera
  );

}

    camera.aspect=
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);
